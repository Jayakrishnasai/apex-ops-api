groups:
  - name: apex_ops_api_alerts
    rules:
      # ── Availability ──────────────────────────────────────────────────────
      - alert: ApiDown
        expr: up{job="apex-ops-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Apex Operations API is down"
          description: "The API has been unreachable for more than 1 minute."

      # ── Latency ───────────────────────────────────────────────────────────
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket{job="apex-ops-api"}[5m])
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on Apex API"
          description: "p95 request latency is above 2s for the last 5 minutes."

      # ── Error rate ────────────────────────────────────────────────────────
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{job="apex-ops-api", status=~"5.."}[5m])
          / rate(http_requests_total{job="apex-ops-api"}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on Apex API"
          description: "More than 5% of requests are returning 5xx errors."

      # ── Saturation ────────────────────────────────────────────────────────
      - alert: HighInProgressRequests
        expr: http_requests_inprogress{job="apex-ops-api"} > 50
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High number of in-progress requests"
          description: "More than 50 requests are currently being processed."
