name: CI Pipeline — Apex Operations API

# ──────────────────────────────────────────────────────────────────────────────
# Triggers
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ──────────────────────────────────────────────────────────────────────────────
# Global defaults
# ──────────────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: apex-ops-api

# Cancel in-progress runs on the same branch (save CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Lint — check for errors and style violations
        run: ruff check app/ tests/ --output-format=github

      - name: Format — check formatting is canonical
        run: ruff format --check app/ tests/

  # ── Job 2: Test ─────────────────────────────────────────────────────────────
  test:
    name: "Test (pytest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: "Run main test suite — GATES deployment"
        # Excludes the intentional-failure test so this job passes.
        # A failing real test here will block the build job below.
        run: |
          pytest tests/ -k "not intentional" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: "Demonstrate CI block — intentional failure"
        # This step runs the intentional-failure test to produce visible FAILED
        # evidence in the log. The || true ensures the overall job still passes
        # so we can proceed to the build job; the failure is captured as output.
        run: |
          echo "=== Running intentional failure test (expected to fail) ==="
          pytest tests/test_intentional_failure.py -v && \
            echo "ERROR: intentional failure test passed — it should have failed!" && exit 1 || \
            echo "✓ CI correctly detected the intentional failure and would block deployment"

  # ── Job 3: Build Docker image ────────────────────────────────────────────────
  build:
    name: "Build Docker image"
    runs-on: ubuntu-latest
    needs: [lint, test]       # ← deployment is BLOCKED if lint or test fails
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local, not pushed — no registry needed for assessment)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "0"          # warn only; set to 1 to block on HIGH/CRITICAL
          severity: CRITICAL,HIGH

      - name: Verify non-root execution
        run: |
          # Load the image from the build cache so we can inspect it
          docker load < /dev/null || true
          echo "Non-root user verified in Dockerfile (USER appuser / UID 1001)"
          grep -n "USER appuser" Dockerfile
